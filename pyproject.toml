[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmnt-malcolms-revenge"
version = "0.1.0"
description = "Read-only mod inspection and sprite validation tools"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.1,<13"]

[project.scripts]
tmnt-mod = "tmnt_mod.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
