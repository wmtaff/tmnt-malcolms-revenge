name: Runtime self-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test without game assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP ('malcolm-runtime-' + [guid]::NewGuid())
          [IO.Directory]::CreateDirectory($output) | Out-Null
          $package = Join-Path $output 'harmony.nupkg'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/lib.harmony/2.2.1/lib.harmony.2.2.1.nupkg' -OutFile $package
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -ne 'EEDA9350790EE24606A60D8A4CDAEE87A143D12BFEACE6D4952959EA2DB6917C') { throw 'Harmony hash mismatch' }
          $archive = [IO.Compression.ZipFile]::OpenRead($package)
          try {
            $entry = $archive.GetEntry('lib/net45/0Harmony.dll')
            if ($null -eq $entry -or $entry.Length -gt 20MB) { throw 'Missing or oversized Harmony DLL' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $output '0Harmony.dll'))
          } finally { $archive.Dispose() }
          $launcher = Join-Path $output 'Malcolm.Runtime.exe'
          $artSources = @((Resolve-Path 'tools/player-assets/CharacterArtConfig.cs').Path, (Resolve-Path 'tools/runtime/CharacterArtRuntime.cs').Path)
          $sources = @('RuntimeLauncher.cs','RuntimeLauncherTests.cs','RuntimeOptions.cs','EncounterConfig.cs','EncounterConfigTests.cs','EncounterRuntime.cs','EncounterRuntimeTests.cs','EncounterHooks.cs','ResidentialRuntime.cs','BackgroundRuntime.cs','CharacterRuntime.cs') | ForEach-Object { (Resolve-Path "tools/runtime/$_").Path }
          $sources += $artSources
          & C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe /nologo /platform:x64 /target:exe /reference:System.Drawing.dll /reference:System.Web.Extensions.dll "/reference:$output/0Harmony.dll" "/out:$launcher" $sources
          if ($LASTEXITCODE -ne 0) { throw 'Runtime compilation failed' }
          & $launcher --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Runtime self-test failed' }
          $residentialTests = Join-Path $output 'Residential.Tests.exe'
          $testSources = @('ResidentialRuntime.cs','ResidentialRuntimeTests.cs') | ForEach-Object { (Resolve-Path "tools/runtime/$_").Path }
          & C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe /nologo /platform:x64 /target:exe /main:Malcolm.Runtime.ResidentialRuntimeTests "/reference:$output/0Harmony.dll" "/out:$residentialTests" $testSources
          if ($LASTEXITCODE -ne 0) { throw 'Residential test compilation failed' }
          & $residentialTests
          if ($LASTEXITCODE -ne 0) { throw 'Residential self-test failed' }
          foreach ($suite in @('CharacterRuntimeTests', 'CharacterArtRuntimeTests')) {
            $testSources = if ($suite -eq 'CharacterRuntimeTests') {
              @('CharacterRuntime.cs','CharacterRuntimeTests.cs') | ForEach-Object { (Resolve-Path "tools/runtime/$_").Path }
            } else { $artSources + @((Resolve-Path 'tools/runtime/CharacterArtRuntimeTests.cs').Path) }
            $testExe = Join-Path $output ($suite + '.exe')
            & C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe /nologo /platform:x64 /target:exe "/main:Malcolm.Runtime.$suite" /reference:System.Drawing.dll /reference:System.Web.Extensions.dll "/reference:$output/0Harmony.dll" "/out:$testExe" $testSources
            if ($LASTEXITCODE -ne 0) { throw "$suite compilation failed" }
            & $testExe
            if ($LASTEXITCODE -ne 0) { throw "$suite failed" }
          }
